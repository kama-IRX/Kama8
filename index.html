<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель поиска файлов</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="page">
    <section class="search-panel">
      <form class="search-form" role="search" action="#" method="get">
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <label class="visually-hidden" for="file-search">Поиск файлов</label>
          <input class="search-input" type="search" id="file-search" name="q" placeholder="Поиск файлов по названию или типу...">
        </div>

        <div class="actions">
          <button class="action-btn" type="button">Фильтры</button>
          <button class="action-btn action-btn--primary" type="submit">Найти</button>
        </div>
      </form>
    </section>
  </main>

</body>
</html>
